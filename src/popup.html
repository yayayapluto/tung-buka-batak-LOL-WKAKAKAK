<!doctype html>
<html lang="id">
    <head>
        <meta charset="UTF-8" />
        <title>AI Mini</title>
        <style>
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                width: 180px;
                background: #111113;
                font-family: system-ui, sans-serif;
                overflow: hidden;
            }

            .container {
                padding: 8px;
                display: flex;
                flex-direction: column;
                gap: 6px;
            }

            .section-label {
                font-size: 9px;
                color: #3a3a45;
                letter-spacing: 0.06em;
                padding: 0 2px;
            }

            .btn-row {
                display: flex;
                gap: 4px;
            }

            .btn-pos {
                flex: 1;
                padding: 6px;
                background: none;
                border: 1px solid #1e1e22;
                border-radius: 5px;
                color: #9090a0;
                font-size: 11px;
                font-weight: 500;
                cursor: pointer;
                text-align: center;
                transition:
                    background 0.1s,
                    color 0.1s,
                    border-color 0.1s;
            }

            .btn-pos:hover,
            .btn-pos.active {
                background: #1e1e22;
                color: #e0e0ec;
                border-color: #4a4a58;
            }

            .divider {
                height: 1px;
                background: #1a1a1e;
            }

            .btn-open {
                width: 100%;
                padding: 6px 10px;
                background: none;
                border: none;
                border-radius: 5px;
                color: #9090a0;
                font-size: 12px;
                font-weight: 500;
                cursor: pointer;
                text-align: left;
                transition:
                    background 0.1s,
                    color 0.1s;
            }

            .btn-open:hover {
                background: #1e1e22;
                color: #e0e0ec;
            }
            .btn-open:active {
                background: #252529;
            }

            .btn-copy {
                width: 100%;
                padding: 6px 10px;
                background: none;
                border: 1px solid #1e1e22;
                border-radius: 5px;
                color: #9090a0;
                font-size: 11px;
                font-weight: 500;
                cursor: pointer;
                text-align: left;
                transition: background 0.1s, color 0.1s, border-color 0.1s;
            }

            .btn-copy:hover {
                background: #1e1e22;
                color: #e0e0ec;
                border-color: #4a4a58;
            }

            .btn-copy.copied {
                color: #ffffff;
                opacity: 0.5;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="section-label">POSISI</div>
            <div class="btn-row">
                <button type="button" class="btn-pos" id="posLeft">Kiri</button>
                <button type="button" class="btn-pos active" id="posRight">Kanan</button>
            </div>

            <div class="divider"></div>

            <div class="section-label">SALIN</div>
            <button type="button" class="btn-copy" id="btn-copy-page">Salin Teks Halaman</button>
            <button type="button" class="btn-copy" id="btn-save-pdf">Simpan sebagai PDF</button>

            <div class="divider"></div>

            <div class="section-label">BUKA</div>
            <button type="button" class="btn-open" id="btn-chatgpt">ChatGPT</button>
            <button type="button" class="btn-open" id="btn-claude">Claude</button>
            <button type="button" class="btn-open" id="btn-gemini">Gemini</button>
            <button type="button" class="btn-open" id="btn-qwen">Qwen</button>
            <button type="button" class="btn-open" id="btn-grok">Grok</button>
            <button type="button" class="btn-open" id="btn-deepseek">DeepSeek</button>
        </div>
        <script src="popup.js"></script>
    </body>
</html>
